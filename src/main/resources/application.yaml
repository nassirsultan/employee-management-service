spring:
  application:
    name: employee-management-service
  datasource:
    url: jdbc:h2:mem:employeedb
#    driver-class-name: org.h2.Driver. docker compose overrides the url and spring boot will autodetect class name based on url
    username: sa
    password: ""
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never